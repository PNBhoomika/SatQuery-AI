# LEVIR-CD+ Building Change Detection Training Config
dataset: "levir_cd"
data_root: "data/raw/levir_cd"
target_gsd: 10.0
backbone: "prithvi_100m"
freeze_backbone: true
epochs: 40
batch_size: 16
learning_rate: 0.0001
loss_weights:
  bce: 1.2
  dice: 1.0
  morphology: 0.5
  type: 0.5
held_out_ratio: 0.20
output_dir: "change_detection/weights/levir_run"
