# Sen1Floods11 SAR + Optical Flood & Water Change Detection Config
dataset: "sen1floods11"
data_root: "data/raw/sen1floods11"
use_sar: true
sar_polarizations: ["VV", "VH"]
target_gsd: 10.0
backbone: "prithvi_100m"
epochs: 35
batch_size: 16
learning_rate: 0.0001
loss_weights:
  bce: 1.2
  dice: 1.2
  morphology: 0.4
  type: 0.6
held_out_ratio: 0.20
output_dir: "change_detection/weights/flood_run"
